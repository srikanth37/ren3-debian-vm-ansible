---
- name: Add MariaDB APT repository
  get_url:
    url: https://downloads.mariadb.com/MariaDB/mariadb_repo_setup
    dest: /tmp/mariadb_repo_setup
    mode: '0755'

- name: Run MariaDB repository setup script
  command: /tmp/mariadb_repo_setup
  args:
    creates: /etc/apt/sources.list.d/mariadb.list

- name: Update APT cache
  apt:
    update_cache: yes

- name: Install MariaDB dependencies
  apt:
    name:
      - libdbi-perl
      - lsof
      - rsync
      - socat
      - perl
      - libmodule-load-perl
    state: present

- name: Install MariaDB server
  apt:
    name: mariadb-server
    state: present

# The apt postinst already started mariadb with the default /var/lib/mysql
# datadir; stop it so the files can be relocated to mariadb_datadir (/data by
# default) before the service is (re)started below.
- name: Stop MariaDB service before migrating datadir
  service:
    name: mariadb
    state: stopped
  ignore_errors: true

- name: Ensure new MariaDB data directory exists
  file:
    path: "{{ mariadb_datadir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: '0700'

- name: Migrate existing MariaDB data to the new datadir
  command: "rsync -a --exclude='lost+found' /var/lib/mysql/ {{ mariadb_datadir }}/"
  args:
    creates: "{{ mariadb_datadir }}/mysql"

- name: Point MariaDB at the new datadir
  copy:
    dest: /etc/mysql/mariadb.conf.d/60-ren3-datadir.cnf
    content: |
      [mysqld]
      datadir = {{ mariadb_datadir }}
    mode: '0644'

- name: Check whether the MariaDB AppArmor profile is present
  stat:
    path: /etc/apparmor.d/usr.sbin.mysqld
  register: mariadb_apparmor_profile

- name: Allow the new datadir in the MariaDB AppArmor profile
  copy:
    dest: /etc/apparmor.d/local/usr.sbin.mysqld
    content: |
      {{ mariadb_datadir }}/ r,
      {{ mariadb_datadir }}/** rwk,
    mode: '0644'
  when: mariadb_apparmor_profile.stat.exists
  register: mariadb_apparmor_local

- name: Reload AppArmor to pick up the datadir exception
  service:
    name: apparmor
    state: reloaded
  when: mariadb_apparmor_local is changed
  ignore_errors: true

- name: Start and enable MariaDB service
  service:
    name: mariadb
    state: started
    enabled: yes

- name: Install PyMySQL for Ansible MySQL modules
  apt:
    name: python3-pymysql
    state: present

- name: Set root password (using socket login)
  community.mysql.mysql_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: root
    password: "{{ mariadb_root_password }}"
    host: localhost
    priv: "*.*:ALL,GRANT"
    check_implicit_admin: yes

- name: Create databases
  community.mysql.mysql_db:
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    name: "{{ item.name }}"
    state: present
  loop: "{{ mariadb_databases }}"