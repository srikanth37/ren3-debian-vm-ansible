# All persistent/growing data (Qdrant vectors, Docker's own image/container/volume
# storage, MariaDB's datadir, and rn3-data uploads+assets) defaults to living under
# /data, kept separate from the app code on app_home and the OS/root disk. Override
# any of these if /data isn't where your data volume is mounted.
qdrant_storage_dir: /data/qdrant
docker_data_root: /data/docker
mariadb_datadir: /data/mysql
rn3_data_dir: /data/rn3-data

qdrant_host: qdrant_host_placeholder
