---
- name: Ensure user "{{ app_user }}" exists
  ansible.builtin.user:
    name: "{{ app_user }}"
    state: present
    shell: /bin/bash
    create_home: yes
    password: '*'
    groups: ['sudo']
    append: yes

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - wget
      - unzip
      - curl
      - gettext
      - librsvg2-bin
      - ghostscript
      - less
      - libgs-dev
      - gcc
      - make
      - build-essential
      - libpng-dev
      - libjpeg-dev
      - libtiff-dev
      - bzip2
      - libbz2-dev
      - libtool
      - libfreetype6-dev
      - libxml2-dev
      - libx11-dev
      - python3
    state: present

- name: Create necessary directories
  ansible.builtin.file:
    path: "{{ app_home }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - files
    - oldfiles
    - server
    - ingestor
    - web
    - EJ2APIServices
    - helper
    - output
  become: true

# rn3-data holds uploads/assets/configs/downloads (i.e. actual growing data, not
# app code), so it lives under rn3_data_dir (/data by default) rather than
# app_home. A compat symlink at the old app_home/rn3-data path is kept below in
# case anything still expects it there.
- name: Create rn3_data_dir
  ansible.builtin.file:
    path: "{{ rn3_data_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  become: true

- name: Create rn3-data directory tree under {{ rn3_data_dir }}
  ansible.builtin.file:
    path: "{{ rn3_data_dir }}/{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  loop:
    - assets
    - assets/audio
    - assets/file
    - configs
    - configs/web
    - configs/server
    - configs/ingestor
    - downloads
    - downloads/sites
    - downloads/sites/save
    - temp
    - tessdata
  become: true

- name: Symlink app_home/rn3-data to rn3_data_dir for backward compatibility
  ansible.builtin.file:
    src: "{{ rn3_data_dir }}"
    dest: "{{ app_home }}/rn3-data"
    state: link
    force: true
  become: true

- name: Copy web config.json file
  ansible.builtin.template:
    src: web-config.json
    dest: "{{ rn3_data_dir }}/configs/web/config.json"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: true

- name: Copy server config.json file
  ansible.builtin.template:
    src: server-config.json
    dest: "{{ rn3_data_dir }}/configs/server/config.json"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: true

- name: Copy ingestor config.json file
  ansible.builtin.template:
    src: web-config.json
    dest: "{{ rn3_data_dir }}/configs/ingestor/config.json"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: true

- name: Set correct file permissions
  ansible.builtin.file:
    path: "{{ app_home }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
    recurse: true
  become: true

- name: Download files archive
  ansible.builtin.get_url:
    url: "{{ app_server_url }}/files.tar.gz"
    dest: /tmp/files.tar.gz
  become: true

- name: Extract files archive
  ansible.builtin.unarchive:
    src: /tmp/files.tar.gz
    dest: "{{ app_home }}/files"
    remote_src: yes
  become: true

- name: Install Node.js and NPM
  import_tasks: install_node.yml